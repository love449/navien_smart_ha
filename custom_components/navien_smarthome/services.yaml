boiler_request:
  name: 보일러 조회·제어
  description: >-
    보일러에 조회 또는 제어 요청을 보냅니다. 봉투는 앱을 분석해 확정했지만
    실기기로 검증하지 않았습니다 — 먼저 `조회`로 응답이 오는지 확인하세요.
    가스 기기이므로 온도는 서버가 알려준 범위 안에서만 전송됩니다.
  fields:
    action:
      name: 동작
      description: >-
        status = 상태 조회 (설정을 바꾸지 않습니다. 먼저 이것으로 확인하세요).
        power_on / power_off = 전원. goout_on / goout_off = 외출.
        only_hotwater = 온수전용.
        inside_temperature / ondol_temperature / hot_water_temperature = 온도 설정
        (value 가 필요합니다).
      required: false
      default: status
      selector:
        select:
          options:
            - status
            - power_on
            - power_off
            - goout_on
            - goout_off
            - only_hotwater
            - inside_temperature
            - ondol_temperature
            - hot_water_temperature
    value:
      name: 온도 (°C)
      description: >-
        온도를 바꾸는 동작에만 씁니다. 0.5°C 단위로 보냅니다.
        서버가 알려준 범위를 벗어나면 보내지 않고 이유를 알려줍니다.
      required: false
      example: 22.5
      selector:
        number:
          min: 10
          max: 65
          step: 0.5
          unit_of_measurement: "°C"
          mode: box
    dry_run:
      name: 드라이런
      description: 켜면 보낼 본문만 응답과 로그에 남기고 실제로 보내지 않습니다.
      required: false
      default: false
      selector:
        boolean:
